<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  /* Streamlit component iframes have a transparent body by default - with no
     explicit background here, this page inherited the dark app's background
     showing through while text stayed near-black, i.e. invisible. This app's
     theme is fixed to dark (.streamlit/config.toml `base = "dark"`), so this
     is styled to match that directly rather than adding light/dark media
     queries for a mode the app itself never uses. */
  html, body {
    margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0e1117; color: #fafafa; color-scheme: dark;
  }
  #box {
    border: 2px dashed #4a4f58; border-radius: 8px; padding: 14px 16px;
    display: flex; align-items: center; gap: 12px; font-size: 14px; color: #fafafa;
    background: #1a1c24;
  }
  #box.dragover { border-color: #0969da; background: #16232f; }
  #status { flex: 1; }
  #status code { background: #262730; padding: 1px 4px; border-radius: 3px; }
  #bar { width: 100%; height: 6px; background: #262730; border-radius: 3px; overflow: hidden; margin-top: 6px; display: none; }
  #bar-fill { height: 100%; width: 0%; background: #0969da; transition: width 0.1s linear; }
  #err { color: #ff6b6b; margin-top: 6px; display: none; }
  input[type=file] { font-size: 13px; color: #fafafa; }
</style>
</head>
<body>
  <div id="box">
    <div id="status">
      <div>Drop a <code>.bin</code>/<code>.log</code> here.</div>
      <input type="file" id="file-input" accept=".bin,.log" />
      <div id="bar"><div id="bar-fill"></div></div>
      <div id="err"></div>
    </div>
  </div>

<script src="./dataflash_parser.js"></script>
<script>
(function () {
  "use strict";

  // Hand-rolled Streamlit bidirectional-component protocol (no
  // streamlit-component-lib/React/build step - just the same four
  // postMessage types that library wraps, confirmed against this app's own
  // installed Streamlit frontend bundle). See:
  // https://docs.streamlit.io/develop/concepts/custom-components/create
  const Streamlit = {
    _ready: false,

    // EVERY message must carry `isStreamlitMessage: true`. Streamlit's
    // ComponentRegistry.onMessageEvent drops anything without that property
    // as its very first check - before the branch that logs "Received
    // component message for unregistered ComponentInstance!" - so a message
    // missing it is discarded in complete silence: no console warning, no
    // error, nothing to debug against. The symptom is the component
    // rendering as an empty box forever, because Streamlit styles the
    // <iframe> `display: componentReady ? "initial" : "none"` and never
    // learns it is ready.
    post: function (message) {
      window.parent.postMessage(Object.assign({ isStreamlitMessage: true }, message), "*");
    },

    init: function () {
      // Two things drive the height, because they cover different events:
      //
      // - `streamlit:render`, sent by the parent once it is actually
      //   displaying this component (and again on every app rerun). This is
      //   the first moment a real measurement is possible at all: until the
      //   parent flips the iframe from display:none, nothing in here has a
      //   layout box and scrollHeight reads 0.
      // - a ResizeObserver, for content that changes without any app rerun -
      //   the status line, the progress bar, an error message. No render
      //   message arrives for those, so nothing else would report them.
      window.addEventListener("message", (event) => {
        const data = event.data || {};
        if (data.type === "streamlit:render") {
          requestAnimationFrame(() => this.setFrameHeight());
        }
      });
      new ResizeObserver(() => this.setFrameHeight()).observe(document.body);
      this.post({ type: "streamlit:componentReady", apiVersion: 1 });
      this._ready = true;
    },
    setFrameHeight: function () {
      this.post({ type: "streamlit:setFrameHeight", height: document.documentElement.scrollHeight });
    },
    setComponentValue: function (value) {
      this.post({ type: "streamlit:setComponentValue", value, dataType: "json" });
    },
  };

  //: What the status line reverts to after a file is cleared or fails. Kept
  //: in step with the same text spelled out in the markup above, which is
  //: what shows before any file has been picked.
  const IDLE_TEXT = "Drop a .bin/.log here.";

  const box = document.getElementById("box");
  const statusEl = document.getElementById("status").firstElementChild;
  const fileInput = document.getElementById("file-input");
  const bar = document.getElementById("bar");
  const barFill = document.getElementById("bar-fill");
  const errEl = document.getElementById("err");

  function setStatus(text) {
    // No explicit setFrameHeight() call needed - the ResizeObserver set up in
    // Streamlit.init() picks up any size change this causes automatically.
    statusEl.textContent = text;
  }

  function setError(text) {
    errEl.textContent = text;
    errEl.style.display = text ? "block" : "none";
  }

  function setProgress(pct) {
    bar.style.display = "block";
    barFill.style.width = pct + "%";
  }

  function handleFile(file) {
    if (!file) return;
    setError("");
    setStatus(`Reading ${file.name}…`);
    setProgress(0);

    const reader = new FileReader();
    reader.onerror = () => {
      setError(`Could not read '${file.name}' from disk.`);
      setStatus(IDLE_TEXT);
    };
    reader.onload = () => {
      setStatus(`Parsing ${file.name}…`);
      // Deferred a tick so the "Parsing…" status actually paints before the
      // (synchronous, CPU-bound) parse blocks the main thread.
      setTimeout(() => {
        try {
          const t0 = performance.now();
          const summary = DaedalusLogParser.parseDataflashLog(reader.result, {
            onProgress: setProgress,
          });
          summary.source_filename = file.name;
          summary.parsed_at = new Date().toISOString();
          const ms = Math.round(performance.now() - t0);
          setStatus(`Parsed ${file.name} in ${ms} ms.`);
          bar.style.display = "none";
          Streamlit.setComponentValue({ ok: true, summary });
        } catch (e) {
          setError(`Could not read '${file.name}' as an ArduPilot log: ${e.message}`);
          setStatus(IDLE_TEXT);
          bar.style.display = "none";
          Streamlit.setComponentValue({ ok: false, filename: file.name, error: String(e.message || e) });
        }
      }, 30);
    };
    reader.readAsArrayBuffer(file);
  }

  fileInput.addEventListener("change", (e) => handleFile(e.target.files[0]));
  ["dragenter", "dragover"].forEach((ev) =>
    box.addEventListener(ev, (e) => { e.preventDefault(); box.classList.add("dragover"); })
  );
  ["dragleave", "drop"].forEach((ev) =>
    box.addEventListener(ev, (e) => { e.preventDefault(); box.classList.remove("dragover"); })
  );
  box.addEventListener("drop", (e) => handleFile(e.dataTransfer.files[0]));

  Streamlit.init();
})();
</script>
</body>
</html>
